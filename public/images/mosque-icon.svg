<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background Circle -->
  <circle cx="32" cy="32" r="30" fill="#055160"/>
  
  <!-- Mosque Base -->
  <rect x="14" y="38" width="36" height="16" fill="#e0c33e"/>
  
  <!-- Main Dome -->
  <ellipse cx="32" cy="32" rx="12" ry="10" fill="#e0c33e"/>
  
  <!-- Center Tower/Minaret -->
  <rect x="29" y="22" width="6" height="10" fill="#e0c33e"/>
